# Tests on every push/PR; on a tag "v*" additionally build packages and publish them as a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Built natively on x86_64 and arm64 (GitHub runner ubuntu-24.04-arm, free for public repos).
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     goarch: amd64, arch: x86_64,  debarch: amd64 }
          - { runner: ubuntu-24.04-arm, goarch: arm64, arch: aarch64, debarch: arm64 }
    # Oldest supported Ubuntu = oldest glibc → binaries also run on Fedora and Arch.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for packaging/scripts/version.sh

      - uses: actions/setup-go@v7
        with:
          # Latest stable Go, not the minimum from go.mod: the minimum (1.24.0) has known
          # vulnerabilities in the standard library (net/http …) that govulncheck reports,
          # and release binaries should contain the patched standard library.
          go-version: stable
          check-latest: true
          cache: true # otherwise the GTK bindings (cgo) take 10–15 min on every run

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev appstream desktop-file-utils

      - name: Tests
        run: make test

      - name: Vulnerability check (govulncheck)
        if: matrix.goarch == 'amd64'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

      - name: Build
        run: make build

      - name: Packages (rpm, deb, arch)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GOTOOLCHAIN: auto
          ARCH: ${{ matrix.goarch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make packages
          # fixed names so that install.sh can use "latest/download/…"
          cd dist
          mv ip-tool-for-axis-*.${{ matrix.arch }}.rpm          ip-tool-for-axis.${{ matrix.arch }}.rpm
          mv ip-tool-for-axis_*_${{ matrix.debarch }}.deb       ip-tool-for-axis.${{ matrix.debarch }}.deb
          mv ip-tool-for-axis-*-${{ matrix.arch }}.pkg.tar.zst  ip-tool-for-axis.${{ matrix.arch }}.pkg.tar.zst
          ls -l

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: packages-${{ matrix.arch }}
          path: dist/

  flatpak:
    # Releases only. The Flatpak build is still untested and doesn't block the release.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Flatpak's make build also derives the app version from Git tags
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.reschcloud.iptoolforaxis.${{ matrix.arch }}.flatpak
          manifest-path: packaging/io.github.reschcloud.iptoolforaxis.yml
          arch: ${{ matrix.arch }}
          upload-artifact: true

  release:
    # also runs if only the (optional) Flatpak build fails
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir out
          find artifacts -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.flatpak' \) \
            -exec cp {} out/ \;
          cp packaging/install.sh out/
          cd out && sha256sum * > SHA256SUMS && ls -l
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
