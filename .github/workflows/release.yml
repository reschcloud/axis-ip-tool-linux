# Tests bei jedem Push/PR; bei einem Tag „v*“ zusätzlich Pakete bauen und als Release veröffentlichen.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Ältestes unterstütztes Ubuntu = älteste glibc → Binaries laufen auch auf Fedora und Arch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags für packaging/scripts/version.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # GTK-Bindings (cgo) sind sonst bei jedem Lauf 10–15 min

      - name: Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev appstream desktop-file-utils

      - name: Tests
        run: make test

      - name: Desktop-Datei und Metainfo prüfen
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

      - name: Bauen
        run: make build

      - name: Pakete (rpm, deb, arch)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make packages
          # Feste Namen, damit install.sh „latest/download/…“ verwenden kann
          cd dist
          mv axis-ip-tool-*.x86_64.rpm         axis-ip-tool.x86_64.rpm
          mv axis-ip-tool_*_amd64.deb          axis-ip-tool.amd64.deb
          mv axis-ip-tool-*-x86_64.pkg.tar.zst axis-ip-tool.x86_64.pkg.tar.zst
          cp ../packaging/install.sh .
          sha256sum * > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: packages
          path: dist/

  flatpak:
    # Nur für Releases. Flatpak-Build ist noch ungetestet und blockiert das Release nicht.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.axisiptool.AxisIpTool.flatpak
          manifest-path: packaging/io.github.axisiptool.AxisIpTool.yml
          upload-artifact: true

  release:
    # Läuft auch, wenn nur der (optionale) Flatpak-Build fehlschlägt
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Dateien einsammeln
        run: |
          mkdir out
          cp artifacts/packages/* out/
          find artifacts -name '*.flatpak' -exec cp {} out/ \; || true
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
