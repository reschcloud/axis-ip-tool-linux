# Flatpak manifest. Build locally: `make flatpak` (downloads the Go modules during the build).
# For Flathub the modules would have to be vendored first (go mod vendor) since it builds offline.
id: io.github.reschcloud.AxisIpTool
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: axis-ip-tool

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # talk to cameras via HTTP, SSDP discovery, ping
  - --share=network
  # Bonjour/mDNS discovery via the system's Avahi service
  - --system-talk-name=org.freedesktop.Avahi

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOPATH: /run/build/axis-ip-tool/go
    GOCACHE: /run/build/axis-ip-tool/go-cache
    GOTOOLCHAIN: local

modules:
  - name: axis-ip-tool
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - go build -trimpath -ldflags '-s -w' -o build/axis-ip-tool ./cmd/axis-ip-tool
      - CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o build/axisctl ./cmd/axisctl
      - make install-app PREFIX=/app DESTDIR=/
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - dist
          - .flatpak-builder
