# nfpm-Konfiguration: GUI + CLI. Bauen mit `make packages`.
name: axis-ip-tool
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: Axis IP Tool <noreply@example.invalid>
description: |
  Axis-Netzwerkkameras finden und einrichten.
  GNOME-App und Kommandozeilenwerkzeug (axisctl), angelehnt an die AXIS IP Utility.
  Kein offizielles Produkt der Axis Communications AB.
license: MIT
homepage: https://github.com/OWNER/axis-ip-tool

contents:
  - src: build/axis-ip-tool
    dst: /usr/bin/axis-ip-tool
    file_info: { mode: 0755 }
  - src: build/axisctl
    dst: /usr/bin/axisctl
    file_info: { mode: 0755 }
  - src: data/io.github.axisiptool.AxisIpTool.desktop
    dst: /usr/share/applications/io.github.axisiptool.AxisIpTool.desktop
  - src: data/io.github.axisiptool.AxisIpTool.metainfo.xml
    dst: /usr/share/metainfo/io.github.axisiptool.AxisIpTool.metainfo.xml
  - src: data/icons/hicolor/scalable/apps/io.github.axisiptool.AxisIpTool.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.axisiptool.AxisIpTool.svg
  - src: data/icons/hicolor/symbolic/apps/io.github.axisiptool.AxisIpTool-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/io.github.axisiptool.AxisIpTool-symbolic.svg

scripts:
  postinstall: packaging/scripts/app-postinstall.sh
  postremove: packaging/scripts/app-postinstall.sh

overrides:
  rpm:
    depends: [gtk4, "libadwaita >= 1.5"]
  deb:
    depends: [libgtk-4-1, "libadwaita-1-0 (>= 1.5)"]
  archlinux:
    depends: [gtk4, libadwaita]
