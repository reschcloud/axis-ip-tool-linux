# nfpm configuration: GUI + CLI. Build with `make packages`.
name: ip-tool-for-axis
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: IP Tool for AXIS contributors <noreply@example.invalid>
description: |
  Find and set up Axis network cameras.
  GNOME app and command line tool (ip-tool-for-axis-cli), modeled on the AXIS IP Utility.
  Not an official product of Axis Communications AB.
license: AGPL-3.0-or-later
homepage: https://github.com/reschcloud/ip-tool-for-axis-linux

contents:
  - src: build/ip-tool-for-axis
    dst: /usr/bin/ip-tool-for-axis
    file_info: { mode: 0755 }
  - src: build/ip-tool-for-axis-cli
    dst: /usr/bin/ip-tool-for-axis-cli
    file_info: { mode: 0755 }
  - src: data/io.github.reschcloud.iptoolforaxis.desktop
    dst: /usr/share/applications/io.github.reschcloud.iptoolforaxis.desktop
  - src: data/io.github.reschcloud.iptoolforaxis.metainfo.xml
    dst: /usr/share/metainfo/io.github.reschcloud.iptoolforaxis.metainfo.xml
  - src: data/icons/hicolor/scalable/apps/io.github.reschcloud.iptoolforaxis.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.reschcloud.iptoolforaxis.svg
  - src: data/icons/hicolor/symbolic/apps/io.github.reschcloud.iptoolforaxis-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/io.github.reschcloud.iptoolforaxis-symbolic.svg
  - src: LICENSE
    dst: /usr/share/licenses/ip-tool-for-axis/LICENSE

scripts:
  postinstall: packaging/scripts/app-postinstall.sh
  postremove: packaging/scripts/app-postinstall.sh

# WebKitGTK 6.0 is optional (loaded at runtime): only the My Axis sign-in for
# firmware downloads needs it.
overrides:
  rpm:
    depends: [gtk4, "libadwaita >= 1.5"]
    recommends: [webkitgtk6.0]
  deb:
    depends: [libgtk-4-1, "libadwaita-1-0 (>= 1.5)"]
    recommends: [libwebkitgtk-6.0-4]
  archlinux:
    depends: [gtk4, libadwaita]
    recommends: ["webkitgtk-6.0: My Axis sign-in for firmware downloads"]
