# nfpm configuration: GUI + CLI. Build with `make packages`.
name: axis-ip-tool
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: Axis IP Tool <noreply@example.invalid>
description: |
  Find and set up Axis network cameras.
  GNOME app and command line tool (axisctl), modeled on the AXIS IP Utility.
  Not an official product of Axis Communications AB.
license: AGPL-3.0-or-later
homepage: https://github.com/reschcloud/axis-ip-tool-linux

contents:
  - src: build/axis-ip-tool
    dst: /usr/bin/axis-ip-tool
    file_info: { mode: 0755 }
  - src: build/axisctl
    dst: /usr/bin/axisctl
    file_info: { mode: 0755 }
  - src: data/io.github.reschcloud.AxisIpTool.desktop
    dst: /usr/share/applications/io.github.reschcloud.AxisIpTool.desktop
  - src: data/io.github.reschcloud.AxisIpTool.metainfo.xml
    dst: /usr/share/metainfo/io.github.reschcloud.AxisIpTool.metainfo.xml
  - src: data/icons/hicolor/scalable/apps/io.github.reschcloud.AxisIpTool.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.reschcloud.AxisIpTool.svg
  - src: data/icons/hicolor/symbolic/apps/io.github.reschcloud.AxisIpTool-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/io.github.reschcloud.AxisIpTool-symbolic.svg
  - src: LICENSE
    dst: /usr/share/licenses/axis-ip-tool/LICENSE

scripts:
  postinstall: packaging/scripts/app-postinstall.sh
  postremove: packaging/scripts/app-postinstall.sh

# WebKitGTK 6.0 is optional (loaded at runtime): only the My Axis sign-in for
# firmware downloads needs it.
overrides:
  rpm:
    depends: [gtk4, "libadwaita >= 1.5"]
    recommends: [webkitgtk6.0]
  deb:
    depends: [libgtk-4-1, "libadwaita-1-0 (>= 1.5)"]
    recommends: [libwebkitgtk-6.0-4]
  archlinux:
    depends: [gtk4, libadwaita]
    recommends: ["webkitgtk-6.0: My Axis sign-in for firmware downloads"]
